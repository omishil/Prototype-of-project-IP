<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Structures & Algorithms - CSE Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-3xl mx-auto px-6 py-10">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Data Structures & Algorithms
        </h1>

        <p class="text-center text-gray-500 mb-8">
            Track your learning progress
        </p>

        <div class="containerOfInnerElements relative       bg-white p-6 rounded-lg shadow-md">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Learning Path
            </h2>

            <div class="containerOfChecks    space-y-5">

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <span>Arrays</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <span>Linked Lists</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <span>Stacks & Queues</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <span>Trees</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <span>Graphs</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5">
                    <span>Sorting & Searching</span>
                </label>
<div class="btn flex flex-col w-full absolute left-[300px] top-0">
            <button class="w-20  block border border-black rounded px-1 bg-blue-900 text-white">add</button>
<input type="text" class="btnInput         w-[200px] h-4 border border-black   left-20 mt-[4px]"></div>
        </div>
        

    </div>
<script>
//event for add
document.querySelector("button").addEventListener("click", ()=>{
    let label= document.createElement("label");
    let buttonContent= document.querySelector(".btnInput")
    label.classList.add("flex","items-center","gap-3");
    label.innerHTML=
     `  <input type="checkbox" class="w-5 h-5">
                    <span>${buttonContent.value}</span>
        `            

let containerOFChecks= document.querySelector(".containerOfChecks")
;
containerOFChecks.append(label)

let newCheckbx= label.querySelector("input")
newCheckbx.addEventListener("click", ()=>{
let conten= label.querySelector("span").classList.toggle("line-through")
})



})

    document.querySelectorAll("input").forEach((input)=>{
        input.addEventListener("click", ()=>{
            input.nextElementSibling.classList.toggle("line-through")
        })
    })
    
</script>
</body>

</html>
