<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Structures & Algorithms - CSE Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-10">

        <h1 class="text-3xl sm:text-4xl font-bold text-center text-slate-800 mb-2">
            Data Structures & Algorithms
        </h1>

        <p class="text-center text-slate-500 mb-8">
            Track your learning progress
        </p>

        <div class="containerOfInnerElements relative bg-white p-5 sm:p-7 rounded-xl shadow-sm border border-slate-200">

            <h2 class="text-2xl font-bold text-slate-800 mb-6">
                Learning Path
            </h2>

            <div class="containerOfChecks space-y-5">

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 accent-teal-600">
                    <span>Arrays</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 accent-teal-600">
                    <span>Linked Lists</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 accent-teal-600">
                    <span>Stacks & Queues</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 accent-teal-600">
                    <span>Trees</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 accent-teal-600">
                    <span>Graphs</span>
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 accent-teal-600">
                    <span>Sorting & Searching</span>
                </label>

            </div>

            <div class="btn flex flex-col sm:flex-row gap-2 sm:items-center mt-7 sm:absolute sm:left-[300px] sm:top-0">

                <button class="w-full sm:w-20 border border-slate-300 rounded-md px-2 py-1.5 bg-slate-800 text-white hover:bg-teal-600 transition">
                    Add
                </button>

                <input
                    type="text"
                    class="btnInput w-full sm:w-[200px] h-9 border border-slate-300 rounded-md px-2 outline-none focus:border-teal-500"
                    placeholder="Add a topic">

            </div>

        </div>

    </div>

    <script>

        //event for add
        document.querySelector("button").addEventListener("click", () => {

            let label = document.createElement("label");

            let buttonContent = document.querySelector(".btnInput");

            label.classList.add("flex", "items-center", "gap-3");

            label.innerHTML =
                `<input type="checkbox" class="w-5 h-5 accent-teal-600">
                 <span>${buttonContent.value}</span>`;

            let containerOFChecks =
                document.querySelector(".containerOfChecks");

            containerOFChecks.append(label);

            let newCheckbx = label.querySelector("input");

            newCheckbx.addEventListener("click", () => {

                label.querySelector("span").classList.toggle("line-through");

            });

        });


        document.querySelectorAll("input").forEach((input) => {

            input.addEventListener("click", () => {

                input.nextElementSibling.classList.toggle("line-through");

            });

        });

    </script>

</body>

</html>
