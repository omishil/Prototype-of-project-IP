<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - CSE Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-6xl mx-auto px-6 py-10">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Student Dashboard
        </h1>

        <p class="text-center text-gray-500 mb-10">
            Choose a learning path and track your progress
        </p>


        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">


            <!-- Web Development -->

            <div class="bg-white p-6 rounded-lg shadow-md">

                <h2 class="text-xl font-bold text-gray-800 mb-3">
                    Web Development
                </h2>

                <p class="text-gray-500 mb-6">
                    Learn HTML, CSS, JavaScript and React.
                </p>

                <a href="web-development.html">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                        Track Progress
                    </button>
                </a>

            </div>


            <!-- Java Programming -->

            <div class="bg-white p-6 rounded-lg shadow-md">

                <h2 class="text-xl font-bold text-gray-800 mb-3">
                    Java Programming
                </h2>

                <p class="text-gray-500 mb-6">
                    Learn Java, OOP, Collections and GUI development.
                </p>

                <a href="java-programming.html">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                        Track Progress
                    </button>
                </a>

            </div>


            <!-- DSA -->

            <div class="bg-white p-6 rounded-lg shadow-md">

                <h2 class="text-xl font-bold text-gray-800 mb-3">
                    Data Structures & Algorithms
                </h2>

                <p class="text-gray-500 mb-6">
                    Learn arrays, linked lists, trees, graphs and algorithms.
                </p>

                <a href="dsa.html">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                        Track Progress
                    </button>
                </a>

            </div>


        </div>

    </div>

</body>

</html>
