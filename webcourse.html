<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development Course - CSE Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#e8f3f3]">

    <div class="max-w-6xl mx-auto px-6 py-10">

        <!-- Title -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Web Development
        </h1>

        <p class="text-center text-gray-500 mb-8">
            Learn Web Development step by step
        </p>


        <!-- Course Area -->
        <div class="bg-white rounded-lg p-6">

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

                <!-- Lessons -->
                <div class="md:col-span-1">

                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        Lessons
                    </h2>

                    <div class="space-y-2">

                        <button
                            onclick="changeLesson('Lesson 1: Introduction to Web Development', 'https://www.youtube.com/embed/Vi9bxu-M-ag')"
                            class="w-full text-left p-3 rounded-lg bg-blue-500 text-white hover:bg-blue-600">
                            Lesson 1
                        </button>

                        <button
                            onclick="changeLesson('Lesson 2: HTML Basics', 'https://www.youtube.com/embed/aRUhd1Wd3Sw?si=hIoc85lXerGXqFTs')"
                            class="w-full text-left p-3 rounded-lg bg-gray-100 hover:bg-gray-200">
                            Lesson 2
                        </button>

                        <button
                            onclick="changeLesson('Lesson 3: CSS Basics', 'https://www.youtube.com/embed/ofHYRdWQESo?si=uUwMnHeORV_1iij-')"
                            class="w-full text-left p-3 rounded-lg bg-gray-100 hover:bg-gray-200">
                            Lesson 3
                        </button>

                        <button
                            onclick="changeLesson('Lesson 4: JavaScript Basics', 'https://www.youtube.com/embed/0gU-qrq3gjU?si=ujB_kgRTjbo6mcwL')"
                            class="w-full text-left p-3 rounded-lg bg-gray-100 hover:bg-gray-200">
                            Lesson 4
                        </button>

                        <button
                            onclick="changeLesson('Lesson 5: JavaScript DOM', 'https://www.youtube.com/embed/e1X3WPoETsk?si=vE86fptIkuCIzWbm')"
                            class="w-full text-left p-3 rounded-lg bg-gray-100 hover:bg-gray-200">
                            Lesson 5
                        </button>

                    </div>

                </div>


                <!-- Video Section -->
                <div class="md:col-span-3">

                    <h2 id="lessonTitle" class="text-2xl font-bold text-gray-800 mb-4">
                        Lesson 1: Introduction to Web Development
                    </h2>

                    <div class="aspect-video">

                        <iframe
                            id="lessonVideo"
                            class="w-full h-full rounded-lg"
                            src="https://www.youtube.com/embed/Vi9bxu-M-ag"
                            title="YouTube video player"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        function changeLesson(title, video) {

            document.getElementById("lessonTitle").innerText = title;

            document.getElementById("lessonVideo").src = video;

        }

    </script>

</body>

</html>
