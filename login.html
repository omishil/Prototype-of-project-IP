<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CSE Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-md">

        <h1 class="text-3xl font-bold text-center mb-2">
            CSE Academy
        </h1>

        <p class="text-gray-500 text-center mb-6">
            Login to your account
        </p>

        <form>

            <label class="block text-gray-700 font-medium mb-2">
                Username
            </label>

          <input 
    type="text"
    id="username"
    placeholder="Enter your username"
    class="w-full border border-gray-300 rounded-md px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
>

            <label class="block text-gray-700 font-medium mb-2">
                Password
            </label>

          <input 
    type="password"
    id="password"
    placeholder="Enter your password"
    class="w-full border border-gray-300 rounded-md px-4 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500"
>

            <button 
                type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700"
            >
                Login
            </button>

        </form>

    </div>
<script src="login.js"></script>
</body>
</html>
